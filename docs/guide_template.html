<title>The alg Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Layout: coluna de leitura estreita; nos problemas, alg e C++ lado a lado (empilham no celular) */
  :root {
    --bg: #f7f6fb;
    --surface: #ffffff;
    --code-bg: #f1eff8;
    --line: #e2deee;
    --fg: #1d1b26;
    --muted: #625f75;
    --accent: #7440c9;
    --accent-soft: #ece4fa;
    --cpp: #9a5b1a;
    --hl-keyword: #8a3fcf;
    --hl-flow: #c2560b;
    --hl-builtin: #0f7f73;
    --hl-method: #2f5fd0;
    --hl-type: #9a6a00;
    --hl-number: #c0392b;
    --hl-string: #4d7f17;
    --hl-comment: #8a879c;
    --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
    --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
    --font-code: "JetBrains Mono", "Cascadia Code", ui-monospace, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16161e;
      --surface: #1d1d28;
      --code-bg: #1f2029;
      --line: #2e2f40;
      --fg: #dcdae6;
      --muted: #9a98ad;
      --accent: #c49af0;
      --accent-soft: #2c2340;
      --cpp: #e0a46a;
      --hl-keyword: #c792ea;
      --hl-flow: #ff9e64;
      --hl-builtin: #7fd1c7;
      --hl-method: #82aaff;
      --hl-type: #ffcb6b;
      --hl-number: #f78c6c;
      --hl-string: #c3e88d;
      --hl-comment: #6c6f85;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #16161e;
    --surface: #1d1d28;
    --code-bg: #1f2029;
    --line: #2e2f40;
    --fg: #dcdae6;
    --muted: #9a98ad;
    --accent: #c49af0;
    --accent-soft: #2c2340;
    --cpp: #e0a46a;
    --hl-keyword: #c792ea;
    --hl-flow: #ff9e64;
    --hl-builtin: #7fd1c7;
    --hl-method: #82aaff;
    --hl-type: #ffcb6b;
    --hl-number: #f78c6c;
    --hl-string: #c3e88d;
    --hl-comment: #6c6f85;
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 4rem;
  }

  main {
    max-width: 1080px;
    margin: 0 auto;
  }

  .prose {
    max-width: 68ch;
  }

  header {
    padding-block: 3.5rem 2rem;
    border-bottom: 1px solid var(--line);
    margin-bottom: 2.5rem;
  }

  h1, h2, h3 {
    font-family: var(--font-display);
    text-wrap: balance;
    line-height: 1.15;
  }

  h1 {
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    margin: 0 0 0.75rem;
    letter-spacing: -0.02em;
  }

  h1 code {
    color: var(--accent);
    font-family: var(--font-code);
    font-weight: 600;
  }

  .lead {
    font-size: 1.15rem;
    color: var(--muted);
    margin: 0;
  }

  h2 {
    font-size: 1.7rem;
    margin: 3.5rem 0 0.75rem;
  }

  h3 {
    font-size: 1.2rem;
    margin: 0 0 0.25rem;
  }

  .eyebrow {
    font: 600 0.75rem/1 var(--font-body);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.5rem;
  }

  nav.toc {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1.5rem;
  }

  nav.toc a {
    font-size: 0.9rem;
    color: var(--fg);
    text-decoration: none;
    padding: 0.3rem 0.7rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
  }

  nav.toc a:hover,
  nav.toc a:focus-visible {
    border-color: var(--accent);
    color: var(--accent);
    outline: none;
  }

  code {
    font-family: var(--font-code);
    font-size: 0.92em;
    background: var(--code-bg);
    padding: 0.1em 0.35em;
    border-radius: 4px;
  }

  pre {
    margin: 0;
    padding: 1rem 1.1rem;
    background: var(--code-bg);
    border-radius: 8px;
    overflow-x: auto;
    font: 0.86rem/1.6 var(--font-code);
    tab-size: 4;
  }

  pre code {
    background: none;
    padding: 0;
    font-size: inherit;
  }

  .kw { color: var(--hl-keyword); }
  .flow { color: var(--hl-flow); font-weight: 600; }
  .bi { color: var(--hl-builtin); }
  .me { color: var(--hl-method); }
  .ty { color: var(--hl-type); }
  .nu { color: var(--hl-number); }
  .st { color: var(--hl-string); }
  .co { color: var(--hl-comment); font-style: italic; }
  .di { color: var(--hl-method); font-weight: 600; }

  .problem {
    margin-top: 2.75rem;
    padding-top: 2rem;
    border-top: 1px solid var(--line);
  }

  .problem p {
    margin: 0.4rem 0 1rem;
    max-width: 75ch;
  }

  .compare {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
    gap: 1rem;
  }

  .compare > figure {
    margin: 0;
    min-width: 0;
  }

  figcaption {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 0.35rem;
    font-variant-numeric: tabular-nums;
  }

  figcaption strong {
    font-family: var(--font-code);
    font-size: 0.85rem;
    color: var(--accent);
  }

  figure.cpp figcaption strong {
    color: var(--cpp);
  }

  .notes {
    margin: 0.9rem 0 0;
    padding-left: 1.1rem;
    color: var(--muted);
    font-size: 0.93rem;
  }

  .notes li + li {
    margin-top: 0.3rem;
  }

  .table-wrap {
    overflow-x: auto;
    margin-top: 1rem;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 560px;
    font-size: 0.92rem;
  }

  th, td {
    text-align: left;
    padding: 0.55rem 0.75rem;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }

  th {
    font: 600 0.75rem/1.2 var(--font-body);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  td.num {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .callout {
    margin-top: 1rem;
    padding: 1rem 1.2rem;
    background: var(--accent-soft);
    border-radius: 8px;
    max-width: 75ch;
  }

  .callout p {
    margin: 0;
  }

  .grid-basics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
    gap: 1rem;
    margin-top: 1rem;
  }

  .grid-basics > div {
    min-width: 0;
  }

  .grid-basics h3 {
    font-size: 1rem;
    margin-bottom: 0.4rem;
  }

  .lang-switch {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    float: right;
    margin-top: 1rem;
    z-index: 5;
    font: 600 0.85rem/1 var(--font-body);
    color: var(--accent);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.5rem 0.9rem;
    cursor: pointer;
  }

  .lang-switch:hover,
  .lang-switch:focus-visible {
    border-color: var(--accent);
    outline: none;
  }

  footer {
    margin-top: 4rem;
    color: var(--muted);
    font-size: 0.9rem;
  }

  a {
    color: var(--accent);
  }

  @media (prefers-reduced-motion: no-preference) {
    nav.toc a {
      transition: border-color 0.15s, color 0.15s;
    }
  }
</style>

<main>
  <button class="lang-switch" type="button" id="lang-switch">Português</button>

</main>

<script>
  (function () {
    const ALG = {
      flow: ["se", "senao", "enquanto", "para", "ate", "em", "ret", "pare", "continue", "if", "else", "while", "for", "to", "in", "thr", "break"],
      kw: ["fn", "e", "ou", "nao", "and", "or", "not", "verdadeiro", "falso", "true", "false", "INF", "maior", "dirigido", "greater", "directed"],
      bi: ["ler", "escrever", "copia", "soma", "min", "max", "ordenar", "heap", "fila", "grafo", "mapa", "read", "write", "sum", "sort", "queue", "graph", "map", "copy", "prefix", "prefixo", "search", "busca", "gcd", "lcm", "mdc", "mmc", "powmod", "potmod", "sieve", "crivo", "count_primes", "conta_primos", "compress", "comprimir", "all", "exists", "some", "todo", "existe", "algum", "set", "conj", "type", "tipo", "dsu", "conjuntos", "fenwick", "segtree", "rmq"],
      ty: ["int", "int32", "real"],
    };
    const CPP = {
      flow: ["if", "else", "while", "for", "return", "continue", "break"],
      kw: ["using", "namespace", "const", "auto", "true", "false", "struct"],
      bi: ["cin", "cout", "sort", "max", "min", "accumulate", "ios", "sync_with_stdio", "tie"],
      ty: ["int", "long", "bool", "void", "vector", "pair", "queue", "priority_queue", "map", "greater", "std"],
    };

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function highlight(source, lang) {
      const words = lang === "cpp" ? CPP : ALG;
      const pattern = /(\/\/[^\n]*|#[^\n]*?(?=\n|$)|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b\d+(?:\.\d+)?\b|\.[A-Za-z_]\w*|[A-Za-z_]\w*)/g;
      let out = "";
      let last = 0;
      let match;

      while ((match = pattern.exec(source))) {
        const token = match[0];
        out += escapeHtml(source.slice(last, match.index));
        last = match.index + token.length;
        let cls = "";

        if (token.startsWith("//")) cls = "co";
        else if (token.startsWith("#")) cls = lang === "cpp" ? "di" : "di";
        else if (token[0] === '"' || token[0] === "'") cls = "st";
        else if (/^\d/.test(token)) cls = "nu";
        else if (token[0] === ".") {
          out += "." + '<span class="me">' + escapeHtml(token.slice(1)) + "</span>";
          continue;
        }
        else if (words.flow.includes(token)) cls = "flow";
        else if (words.kw.includes(token)) cls = "kw";
        else if (words.bi.includes(token)) cls = "bi";
        else if (words.ty.includes(token)) cls = "ty";

        out += cls ? '<span class="' + cls + '">' + escapeHtml(token) + "</span>" : escapeHtml(token);
      }

      return out + escapeHtml(source.slice(last));
    }

    document.querySelectorAll("pre code.lang-alg, pre code.lang-cpp").forEach(function (block) {
      const lang = block.classList.contains("lang-cpp") ? "cpp" : "alg";
      block.innerHTML = highlight(block.textContent, lang);
    });
  })();
</script>
<script>
  (function () {
    const button = document.querySelector(".lang-switch");
    const views = document.querySelectorAll(".lang");

    function show(lang) {
      views.forEach(function (view) {
        view.hidden = view.dataset.lang !== lang;
      });
      document.documentElement.lang = lang;
      button.textContent = lang === "en" ? "Português" : "English";
      button.dataset.target = lang === "en" ? "pt" : "en";
      try {
        localStorage.setItem("alg-guide-lang", lang);
      } catch (error) {
        /* sem armazenamento: o guia abre em inglês */
      }
    }

    let saved = "en";
    try {
      saved = localStorage.getItem("alg-guide-lang") || "en";
    } catch (error) {
      saved = "en";
    }

    button.addEventListener("click", function () {
      show(button.dataset.target);
    });
    show(saved === "pt" ? "pt" : "en");
  })();
</script>
